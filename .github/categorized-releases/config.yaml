# =============================================================================
# Categorized Releases Configuration
# =============================================================================

defaults:
  latest-match: newest
  cutoff-date: false
  max-displayed: 100
  inherit-parent-matchers: false

site:
  title: "Nestor80 Releases"
  description: "Release history organized by tool"
  favicon: "https://github.com/Konamiman/Nestor80/blob/master/NuGet/N80_NuGet_logo.png?raw=true"
  show-latest-only-toggle: true
  hide-tag: hide-in-categorized-releases

  main-page:
    render: true
    content: |
      # Nestor80, Linkstor80 and Libstor80 releases

      This is the categorized releases page for [the Nestor80 project](https://github.com/konamiman/Nestor80).
      Releases are organized by tool:

      * **Nestor80**: The assembler, used to generate both absolute and relocatable binaries.
      * **Linkstor80**: The linker, used to link relocatable binaries into a single executable.
      * **Libstor80**: The library manager, used to create and manage libraries of relocatable binaries.

      There are several variants of each tool available for download:

      * The "Framework dependant" and "Portable" variants require [the .NET runtime](https://dotnet.microsoft.com/en-us/download/dotnet/) (.NET 6 or newer) to be installed. 
      * The "Standalone" variants don't require the .NET runtime to be installed, but they are much bigger in size (about 60MB vs about 400KB for the framework dependant variants).
      * You'll need the "Portable" variant if your system supports .NET 6 but there isn't a native variant (standalone or framework dependant) available. To run this variant the `dotnet` tool (installed as part of the .NET runtime) needs to be used as follows: `dotnet N80.dll <arguments>`. Otherwise this variant works exactly like the native ones.

      You can also browse [the regular GitHub releases page](https://github.com/konamiman/Nestor80/releases) 
      for all the (uncategorized) releases in chronological order.

latest-page:
  enable: true
  title: "Latest Releases"
  description: |
    Browse the most recent releases across all tools.

    **Display modes:**
    - **Releases**: Full release cards with details
    - **Assets**: Downloadable files sorted by date or name

unmatched:
  show: true
  name: "Miscellaneous"

categories:
  - name: "Nestor80"
    tooltip: "Nestor80 assembler"
    description: |
      Nestor80 is a Z80 and Z280 assembler that allows to generate absolute and relocatable binaries.
    assets: "N80_"

  - name: "Linkstor80"
    tooltip: "Linkstor80 linker"
    description: |
      Linkstor80 is a linker for relocatable binaries created with Nestor80.
    assets: "LK80_"

  - name: "Libstor80"
    tooltip: "Libstor80 library manager"
    description: |
      Libstor80 is the library manager for relocatable binaries created with Nestor80.
    assets: "LB80_"
